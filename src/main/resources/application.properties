spring.datasource.url=jdbc:mysql://localhost:3307/takedrink
spring.datasource.username=takedrink_app
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ==========================================
# APPLICATION LOGGING
# ==========================================

# Hiển thị log DEBUG của ứng dụng TakeDrink
logging.level.com.takedrink.backend=DEBUG

# Theo dõi quá trình xử lý request của Spring MVC
logging.level.org.springframework.web=DEBUG

# Theo dõi xác thực và phân quyền Spring Security
logging.level.org.springframework.security=DEBUG

# Theo dõi câu lệnh SQL do Hibernate sinh ra
logging.level.org.hibernate.SQL=DEBUG

# Theo dõi tham số được bind vào câu lệnh SQL
# Hibernate 6 / Spring Boot 3 thường dùng cấu hình này
logging.level.org.hibernate.orm.jdbc.bind=TRACE

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

