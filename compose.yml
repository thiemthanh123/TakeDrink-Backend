services:
  takedrink-db:
    image: mysql:8.4
    container_name: takedrink-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: takedrink
      MYSQL_USER: takedrink_app
      MYSQL_PASSWORD: 123456
    ports:
      - "3307:3306"
    volumes:
      - takedrink_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  takedrink_mysql_data: